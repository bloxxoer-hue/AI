services:
  - type: web
    name: video-generator-site
    runtime: node
    plan: starter
    buildCommand: npm install && npx playwright install --with-deps chromium
    startCommand: npm start
    envVars:
      # на сервере нет дисплея — хром обязан быть headless
      - key: HEADLESS
        value: "1"
    healthCheckPath: /api/sites
    # необязательные ключи API (браузер работает и без них):
    # - key: MINIMAX_API_KEY
    #   sync: false
    # - key: KLING_ACCESS_KEY
    #   sync: false
    # - key: OPENAI_API_KEY
    #   sync: false

    # постоянный диск для outputs/ (иначе готовые ролики живут до первого редеплоя).
    # если включаешь — замени startCommand на: rm -rf outputs && ln -s /var/data/outputs outputs && npm start
    # disk:
    #   name: outputs
    #   sizeGB: 5
    #   mountPath: /var/data
